name: Nfyra CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_analyze:
    name: Flutter Analyze, Test & Offline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify NO INTERNET permission in AndroidManifest
        working-directory: mobile
        run: |
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission detected! Nfyra is strictly offline."
            exit 1
          fi
          echo "Verified: No INTERNET permission declared."

      - name: Run Flutter Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test

